<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toko Microservices</title>
<style>body{font-family:Arial;margin:0;background:#f1f5f9;color:#172033}header{background:#173b6d;color:white;padding:24px 7%}main{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.box,.product{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 9px #d5dce5;margin-bottom:18px}input,select,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:7px}button{background:#173b6d;color:white;border:0;cursor:pointer}.product h3{margin-top:0}.price{font-weight:bold;color:#173b6d;font-size:18px}.muted{color:#64748b}.success{color:#15803d}.error{color:#b91c1c}h2{margin-top:30px}</style></head>
<body><header><h1>Toko Microservices</h1><p>Belanja sederhana melalui API Gateway</p></header><main>
<h2>Daftar Produk</h2><div id="products" class="grid"><p>Memuat produk...</p></div>
<div class="grid"><section class="box"><h2>Register</h2><input id="regName" placeholder="Nama"><input id="regEmail" placeholder="Email"><input id="regPassword" type="password" placeholder="Password"><input id="regAddress" placeholder="Alamat"><button onclick="register()">Daftar</button><p id="regMsg"></p></section>
<section class="box"><h2>Login</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p></section></div>
<section class="box"><h2>Checkout</h2><p id="userInfo" class="muted">Login terlebih dahulu.</p><select id="productSelect"></select><input id="quantity" type="number" value="1" min="1"><select id="method"><option value="transfer">Transfer Bank</option><option value="ewallet">E-Wallet</option><option value="cod">COD</option></select><button onclick="checkout()">Buat Order & Bayar</button><p id="orderMsg"></p></section>
</main><script>
let products=[],token=localStorage.getItem('token');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Request gagal');return d}
async function load(){products=await api('/api/products');document.querySelector('#products').innerHTML=products.map(p=>`<article class="product"><h3>${p.name}</h3><p class="muted">${p.category} · stok ${p.stock}</p><p class="price">Rp ${Number(p.price).toLocaleString('id-ID')}</p></article>`).join('');document.querySelector('#productSelect').innerHTML=products.map(p=>`<option value="${p.id}">${p.name} - Rp ${Number(p.price).toLocaleString('id-ID')}</option>`).join('')}
async function register(){try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({name:regName.value,email:regEmail.value,password:regPassword.value,address:regAddress.value})});regMsg.className='success';regMsg.textContent='Berhasil daftar sebagai '+d.name}catch(e){regMsg.className='error';regMsg.textContent=e.message}}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;localStorage.setItem('token',token);userInfo.textContent='Login sebagai '+d.user.name;loginMsg.className='success';loginMsg.textContent='Login berhasil'}catch(e){loginMsg.className='error';loginMsg.textContent=e.message}}
async function checkout(){try{if(!token)throw Error('Silakan login dulu');let p=products.find(x=>x.id===productSelect.value),qty=Number(quantity.value),o=await api('/api/orders',{method:'POST',body:JSON.stringify({items:[{productId:p.id,name:p.name,price:p.price,quantity:qty}]})});await api('/api/payments',{method:'POST',body:JSON.stringify({orderId:o.id,amount:o.total,method:method.value})});orderMsg.className='success';orderMsg.textContent=`Order ${o.id} berhasil dibayar. Total Rp ${o.total.toLocaleString('id-ID')}`;load()}catch(e){orderMsg.className='error';orderMsg.textContent=e.message}}
load().catch(e=>document.querySelector('#products').textContent=e.message);
</script></body></html>
